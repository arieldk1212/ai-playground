[project]
name = "ai-playground"
version = "0.1.0"
description = "AI research lab and gpus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flydsl==0.1.8; sys_platform == 'linux'",
    "google-ml-edu>=0.1.3",
    "gym>=0.26.2",
    "hip-python>=7.2.2.562.43; sys_platform == 'linux'",
    "keras>=3.14.1",
    "matplotlib>=3.10.9",
    "mempalace>=3.3.5",
    "npu>=0.3.900; sys_platform == 'linux'",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "plotly>=6.7.0",
    "stable-baselines3[extra]>=2.8.0",
    "tensorflow>=2.21.0",
    "tinygrad>=0.12.0",
    "torch>=2.11.0",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
